name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle and validates the wrapper jar
      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build lwjgl3:jar --console=plain

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/'
          retention-days: 7

      - name: Upload runnable jar
        uses: actions/upload-artifact@v4
        with:
          name: tumbalata-jar
          path: lwjgl3/build/libs/*.jar
          retention-days: 14
